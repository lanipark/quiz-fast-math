<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="40%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Top Ambient Glow -->
    <radialGradient id="topGlow" cx="50%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Center Warm Aura behind lightning -->
    <radialGradient id="centerAura" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#4F46E5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Lightning Drop Shadow & Glow -->
    <filter id="boltFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#F59E0B" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#090A1A" flood-opacity="0.6"/>
    </filter>

    <!-- Symbol Drop Shadow -->
    <filter id="symbolFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#090A1A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle rounded background for browser favicon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="115" fill="url(#topGlow)"/>
  <circle cx="256" cy="256" r="180" fill="url(#centerAura)"/>

  <!-- Math Operators Group (+ - × ÷) -->
  <g filter="url(#symbolFilter)" fill="#FFFFFF">
    <!-- Top-Left: PLUS (+) -->
    <g transform="translate(132, 136)">
      <rect x="-30" y="-8.5" width="60" height="17" rx="8.5"/>
      <rect x="-8.5" y="-30" width="17" height="60" rx="8.5"/>
    </g>

    <!-- Top-Right: MINUS (-) -->
    <g transform="translate(380, 136)">
      <rect x="-30" y="-8.5" width="60" height="17" rx="8.5"/>
    </g>

    <!-- Bottom-Left: MULTIPLY (×) -->
    <g transform="translate(132, 376) rotate(45)">
      <rect x="-30" y="-8.5" width="60" height="17" rx="8.5"/>
      <rect x="-8.5" y="-30" width="17" height="60" rx="8.5"/>
    </g>

    <!-- Bottom-Right: DIVIDE (÷) -->
    <g transform="translate(380, 376)">
      <rect x="-30" y="-8.5" width="60" height="17" rx="8.5"/>
      <circle cx="0" cy="-25" r="9.5"/>
      <circle cx="0" cy="25" r="9.5"/>
    </g>
  </g>

  <!-- Center: LIGHTNING BOLT (Fast Flash Arithmetic) -->
  <g filter="url(#boltFilter)">
    <!-- Main Bolt Body -->
    <path d="M 284 80
             L 192 254
             L 254 254
             L 228 432
             L 324 236
             L 264 236
             Z"
          fill="url(#boltGrad)"/>

    <!-- Subtle Bevel Highlight -->
    <path d="M 284 80
             L 192 254
             L 254 254
             L 242 320
             L 278 244
             L 264 236
             Z"
          fill="#FFFFFF"
          opacity="0.32"/>
  </g>
</svg>